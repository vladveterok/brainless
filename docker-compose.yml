version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - CREDENTIALS_OVERWRITE_DATA={"telegramApi":{"accessToken":"${TELEGRAM_BOT_TOKEN}"}}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_ENV_VARS_ALLOW_LIST=GEMINI_API_KEY
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n

  youtube-extractor:
    build: ./services/youtube-extractor
    container_name: youtube-extractor
    restart: always
    expose:
      - "5000"

volumes:
  n8n_data:
